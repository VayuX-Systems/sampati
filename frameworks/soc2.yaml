# SPDX-License-Identifier: Apache-2.0
# SOC 2 Type II Framework - Draft
# This is Sampati's own wording with references to AICPA Trust Services Criteria
# NOT a copy of the copyrighted AICPA text

id: soc2
name: "SOC 2 Type II"
version: "2024.1.0"
status: reviewed
description: "Security, Availability, Confidentiality trust services criteria per AICPA TSC 2017"
source_url: "https://www.aicpa.org/interestareas/frc/assuranceadvisoryservices/soc2.html"
requirements:
  - id: CC1.1
    title: "Control Environment - Integrity and Ethical Values"
    text: "The entity demonstrates a commitment to integrity and ethical values through documented policies, leadership example, and accountability mechanisms."
    category: "Control Environment"
    parent: null
    references:
      - source: "AICPA TSC 2017"
        clause: "CC1.1"

  - id: CC1.2
    title: "Control Environment - Board Independence"
    text: "The board of directors or equivalent governing body exercises independence from management and oversight of the control environment."
    category: "Control Environment"
    parent: null
    references:
      - source: "AICPA TSC 2017"
        clause: "CC1.2"

  - id: CC2.1
    title: "Communication and Information - Internal Communication"
    text: "The entity internally communicates information, including objectives and responsibilities for internal control, necessary to support the functioning of internal control."
    category: "Communication"
    parent: null
    references:
      - source: "AICPA TSC 2017"
        clause: "CC2.1"

  - id: CC3.1
    title: "Risk Assessment - Objectives and Risks"
    text: "The entity specifies objectives with sufficient clarity to enable the identification and assessment of risks relating to objectives."
    category: "Risk Assessment"
    parent: null
    references:
      - source: "AICPA TSC 2017"
        clause: "CC3.1"

  - id: CC4.1
    title: "Monitoring Activities - Ongoing Evaluations"
    text: "The entity selects, develops, and performs ongoing and/or separate evaluations to ascertain whether the components of internal control are present and functioning."
    category: "Monitoring"
    parent: null
    references:
      - source: "AICPA TSC 2017"
        clause: "CC4.1"

  - id: CC5.1
    title: "Control Activities - Selection and Development"
    text: "The entity selects and develops control activities that contribute to the mitigation of risks to the achievement of objectives to acceptable levels."
    category: "Control Activities"
    parent: null
    references:
      - source: "AICPA TSC 2017"
        clause: "CC5.1"

  - id: CC6.1
    title: "Logical and Physical Access Controls - Access Management"
    text: "The entity implements logical access security software, infrastructure, and architectures to protect its information assets from security events."
    category: "Logical Access"
    parent: null
    references:
      - source: "AICPA TSC 2017"
        clause: "CC6.1"

  - id: CC6.2
    title: "Logical and Physical Access Controls - Credential Management"
    text: "Prior to issuing system credentials and granting system access, the entity registers and authorizes new internal and external users whose access is administered by the entity."
    category: "Logical Access"
    parent: null
    references:
      - source: "AICPA TSC 2017"
        clause: "CC6.2"

  - id: CC6.3
    title: "Logical and Physical Access Controls - Privileged Access"
    text: "The entity authorizes, modifies, or removes access to data, software, functions, and other protected information assets based on roles, responsibilities, or the system design and changes."
    category: "Logical Access"
    parent: null
    references:
      - source: "AICPA TSC 2017"
        clause: "CC6.3"

  - id: CC6.4
    title: "Logical and Physical Access Controls - Multi-Factor Authentication"
    text: "The entity restricts logical access to the system through the use of multi-factor authentication for remote access and administrative access."
    category: "Logical Access"
    parent: null
    references:
      - source: "AICPA TSC 2017"
        clause: "CC6.4"

  - id: CC6.5
    title: "Logical and Physical Access Controls - Network Segmentation"
    text: "The entity discontinues logical and physical protections over system assets only after the ability to recover the system is no longer required."
    category: "Logical Access"
    parent: null
    references:
      - source: "AICPA TSC 2017"
        clause: "CC6.5"

  - id: CC6.6
    title: "Logical and Physical Access Controls - Encryption"
    text: "The entity implements logical access security measures to protect against security events through the use of encryption for data at rest and in transit."
    category: "Logical Access"
    parent: null
    references:
      - source: "AICPA TSC 2017"
        clause: "CC6.6"

  - id: CC6.7
    title: "Logical and Physical Access Controls - Data Transmission"
    text: "The entity restricts the transmission, movement, and removal of information to authorized internal and external users and processes."
    category: "Logical Access"
    parent: null
    references:
      - source: "AICPA TSC 2017"
        clause: "CC6.7"

  - id: CC7.1
    title: "System Operations - Incident Detection"
    text: "The entity uses detection monitoring procedures to identify (1) changes to configurations that result in the introduction of new vulnerabilities, and (2) susceptibilities to newly discovered vulnerabilities."
    category: "System Operations"
    parent: null
    references:
      - source: "AICPA TSC 2017"
        clause: "CC7.1"

  - id: CC7.2
    title: "System Operations - Incident Response"
    text: "The entity monitors system components and the operation of those components for anomalies that are indicative of malicious acts, natural disasters, and errors affecting the entity's ability to meet its objectives."
    category: "System Operations"
    parent: null
    references:
      - source: "AICPA TSC 2017"
        clause: "CC7.2"

  - id: CC7.3
    title: "System Operations - Vulnerability Management"
    text: "The entity evaluates identified vulnerabilities and implements remediation through defined processes."
    category: "System Operations"
    parent: null
    references:
      - source: "AICPA TSC 2017"
        clause: "CC7.3"

  - id: CC7.4
    title: "System Operations - Incident Response Plan"
    text: "The entity responds to identified security incidents by executing a defined incident response program."
    category: "System Operations"
    parent: null
    references:
      - source: "AICPA TSC 2017"
        clause: "CC7.4"

  - id: CC7.5
    title: "System Operations - Recovery"
    text: "The entity recovers from identified security incidents by executing a defined recovery plan."
    category: "System Operations"
    parent: null
    references:
      - source: "AICPA TSC 2017"
        clause: "CC7.5"

  - id: CC8.1
    title: "Change Management - Change Authorization"
    text: "The entity authorizes, designs, develops, and tests changes to system components, including infrastructure, data, software, and procedures."
    category: "Change Management"
    parent: null
    references:
      - source: "AICPA TSC 2017"
        clause: "CC8.1"

  - id: A1.1
    title: "Availability - Maintenance and Monitoring"
    text: "The entity maintains, monitors, and evaluates current processing capacity and usage of system components to manage capacity demand and to enable the implementation of additional capacity."
    category: "Availability"
    parent: null
    references:
      - source: "AICPA TSC 2017"
        clause: "A1.1"

  - id: A1.2
    title: "Availability - Disaster Recovery"
    text: "The entity tests recovery plan procedures supporting system recovery to meet its objectives."
    category: "Availability"
    parent: null
    references:
      - source: "AICPA TSC 2017"
        clause: "A1.2"

  - id: C1.1
    title: "Confidentiality - Data Classification"
    text: "The entity identifies and maintains confidential information to meet the entity's objectives related to confidentiality."
    category: "Confidentiality"
    parent: null
    references:
      - source: "AICPA TSC 2017"
        clause: "C1.1"

  - id: C1.2
    title: "Confidentiality - Data Disposal"
    text: "The entity disposes of confidential information to meet the entity's objectives related to confidentiality."
    category: "Confidentiality"
    parent: null
    references:
      - source: "AICPA TSC 2017"
        clause: "C1.2"