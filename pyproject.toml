# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sampati"
version = "0.1.0-dev"
description = "Sampati by VayuX - Community Edition"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "VayuX Systems", email = "dev@vayux.systems" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "redis>=5.0",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pydantic-extra-types>=2.9",
    "structlog>=24.1",
    "prometheus-client>=0.19",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp>=1.25",
    "pyotp>=2.9",
    "qrcode>=7.4",
    "pyyaml>=6.0",
    "python-magic>=0.4.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "faker>=25.0",
    "pytest-mock>=3.12",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "faker>=25.0",
    "pytest-mock>=3.12",
]

[tool.setuptools.packages.find]
where = ["apps/api/src", "apps/worker/src", "packages/core-domain/src", "packages/rules-engine/src", "packages/ledger/src", "packages/plugin-host/src", "packages/extension-points/src", "packages/ui-kit/src"]
include = ["sampati_api*", "sampati_worker*", "sampati_core_domain*", "sampati_rules_engine*", "sampati_ledger*", "sampati_plugin_host*", "sampati_extension_points*", "sampati_ui_kit*"]

[tool.setuptools.package-dir]
"sampati_api" = "apps/api/src/sampati_api"
"sampati_worker" = "apps/worker/src/sampati_worker"
"sampati_core_domain" = "packages/core-domain/src/sampati_core_domain"
"sampati_rules_engine" = "packages/rules-engine/src/sampati_rules_engine"
"sampati_ledger" = "packages/ledger/src/sampati_ledger"
"sampati_plugin_host" = "packages/plugin-host/src/sampati_plugin_host"
"sampati_extension_points" = "packages/extension-points/src/sampati_extension_points"
"sampati_ui_kit" = "packages/ui-kit/src/sampati_ui_kit"

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "PTH", "SIM", "T20"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["apps/api/src", "packages/core-domain/src"]
omit = ["*/tests/*", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
