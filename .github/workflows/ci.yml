# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: |
          uv pip install --system ruff mypy

      - name: Run ruff
        run: ruff check .

      - name: Run mypy
        run: mypy .

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sampati_test
          POSTGRES_USER: sampati
          POSTGRES_PASSWORD: sampati
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U sampati -d sampati_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: |
          uv pip install --system -e ./apps/api[dev]
          uv pip install --system -e ./packages/core-domain
          uv pip install --system -e ./packages/rules-engine
          uv pip install --system -e ./packages/ledger
          uv pip install --system -e ./packages/plugin-host
          uv pip install --system -e ./packages/extension-points

      - name: Run tests
        env:
          SAMPATI_DATABASE_URL: postgresql+asyncpg://sampati:sampati@localhost:5432/sampati_test
          SAMPATI_REDIS_URL: redis://localhost:6379/0
          SAMPATI_ENV: test
        run: pytest -xvs

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run truffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD

  licence-scan:
    name: Licence Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run licence scan
        uses: peter-evans/licence-scan@v1
        with:
          path: .
          config: .github/licence-scan.yml

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json

  build:
    name: Build Docker Images
    needs: [lint-and-typecheck, test, secret-scan, licence-scan, static-analysis]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile.api
          push: false
          tags: ghcr.io/vayux-systems/sampati-api:${{ github.sha }}
          load: true

      - name: Build Worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile.worker
          push: false
          tags: ghcr.io/vayux-systems/sampati-worker:${{ github.sha }}
          load: true

      - name: Sign images
        run: |
          # TODO: Add cosign signing
          echo "Image signing not yet configured"