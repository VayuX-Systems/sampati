# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sampati-core-domain"
version = "0.1.0-dev"
description = "Sampati core domain models and logic"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "VayuX Systems", email = "dev@vayux.systems" }]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["sampati_core_domain*"]

[tool.setuptools.package-dir]
"" = "src"

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "PTH", "SIM", "T20"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
