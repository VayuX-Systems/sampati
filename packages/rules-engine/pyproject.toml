# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sampati-rules-engine"
version = "0.1.0-dev"
description = "Sampati Rules Engine - CEL-based control test evaluation"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "VayuX Systems", email = "dev@vayux.systems" }]
requires-python = ">=3.12"
dependencies = [
    "celpy>=0.0.1",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "pydantic>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["sampati_rules_engine*"]

[tool.setuptools.package-dir]
"" = "src"

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "PTH", "SIM", "T20"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
