# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sampati-plugin-host"
version = "0.1.0-dev"
description = "Sampati Plugin Host - runs plugins out-of-process with sandboxing"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "VayuX Systems", email = "dev@vayux.systems" }]
requires-python = ">=3.12"
dependencies = [
    "docker>=7.0",
    "grpcio>=1.62",
    "grpcio-tools>=1.62",
    "pydantic>=2.8",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["sampati_plugin_host*"]

[tool.setuptools.package-dir]
"" = "src"

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "PTH", "SIM", "T20"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
